<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      p {
        margin-top: 0;
        margin-bottom: 0;
        font-family: Roboto, Arial;
      }
      .search-box {
        display: block;
      }
      .thumbnail {
        width: 300px;
      }
      .video-preview {
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
      }
      .channel-img,
      .video-content {
        display: inline-block;
      }
      .channel-img {
        width: 36px;
        vertical-align: top;
      }
      .video-content {
        width: 240px;
        margin-left: 12px;
        vertical-align: top;
      }
      .chan-img {
        width: 100%;
        border-radius: 18px;
      }
      .img-status {
        margin-bottom: 10px;
      }
      .video-title {
        width: 100%;
      }
      .video-author {
        margin-top: 10px;
      }
      .video-title {
        font-weight: 500;
        font-size: 14px;
      }
      .video-author,
      .video-stats {
        font-size: 12px;
        color: rgb(96, 96, 96);
      }
      .video-stats {
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <input class="search-box" type="text" placeholder="Search" />

    <div class="video-preview">
      <div class="img-status">
        <img class="thumbnail" src="images/thumbnail-1.webp" />
      </div>
      <div>
        <div class="channel-img">
          <img class="chan-img" src="channel-images/channel-1.jpeg" alt="" />
        </div>
        <div class="video-content">
          <p class="video-title">
            Talking Tech <strong>and AI with</strong> Google CEO Sundar Pichai!
          </p>
          <p class="video-author">Marques Brownlee</p>
          <p class="video-stats">3.4M views &#183; 6 months ago</p>
        </div>
      </div>
    </div>

    <div class="video-preview">
      <div class="img-status">
        <img class="thumbnail" src="images/thumbnail-2.webp" />
      </div>
      <div>
        <div class="channel-img">
          <img class="chan-img" src="channel-images/channel-2.jpeg" alt="" />
        </div>
        <div class="video-content">
          <p class="video-title">Try Not To Laugh Challenge #9</p>
          <p class="video-author">Markiplier</p>
          <p class="video-stats">19M views &#183; 4 years ago</p>
        </div>
      </div>
    </div>

</html>
